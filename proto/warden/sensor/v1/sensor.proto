syntax = "proto3";

package warden.sensor.v1;

option go_package = "github.com/NicolasPaterno/warden-proto/gen/go/warden/sensor/v1;sensorv1";

import "google/protobuf/timestamp.proto";

enum SensorType {
  SENSOR_TYPE_UNSPECIFIED = 0;
  SENSOR_TYPE_TEMPERATURE = 1;
  SENSOR_TYPE_HUMIDITY    = 2;
  SENSOR_TYPE_MOTION      = 3;
  SENSOR_TYPE_CO2         = 4;
}

message SensorReading {
  string                    sensor_id = 1;
  string                    room      = 2;
  SensorType                type      = 3;
  double                    value     = 4;
  string                    unit      = 5;
  google.protobuf.Timestamp timestamp = 6;
}
